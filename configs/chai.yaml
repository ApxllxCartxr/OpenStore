# OpenStore configuration — Chai House (second demo merchant)
# Fill in all values; unknown keys cause hard failure (R0.3)

merchant:
  name: "Chai House"
  currency: "INR"

# Without this, load_config derives <config-dir>/catalog.yaml and chai would
# silently serve the gelateria catalog.
catalog_path: "chai_catalog.yaml"

razorpay:
  key_id: "${RAZORPAY_KEY_ID}"
  key_secret: "${RAZORPAY_KEY_SECRET}"
  webhook_secret: "${RAZORPAY_WEBHOOK_SECRET}"

discord:
  bot_token: "${DISCORD_BOT_TOKEN}"
  buyer_trace_channel_id: 223456789012345678
  merchant_trace_channel_id: 223456789012345679
  money_trace_channel_id: 223456789012345680
  alerts_channel_id: 223456789012345681
  # Buyer agent now runs as its own process; disable in-process BuyerBot to
  # avoid a second Discord login on the shared bot_token (gelateria + chai).
  buyer_bot_enabled: false

webauthn:
  rp_id: "localhost"
  rp_name: "OpenStore Demo — Chai"
  origin: "http://localhost:8001"

database:
  url: "sqlite:///data/chai_openstore.db"

llm:
  model: "gpt-4o-mini"
  temperature: 0.2

campaign:
  min_bps: 500
  max_bps: 3000
  max_active: 5
