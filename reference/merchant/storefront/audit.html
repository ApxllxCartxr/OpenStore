<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Log</title>
  <style>
    :root { --ink: #1f2937; --muted: #6b7280; --bg: #f8fafc; --card: #fff;
            --ok: #dcfce7; --ok-ink: #166534; --bad: #fee2e2; --bad-ink: #991b1b; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; color: var(--ink);
           background: var(--bg); }
    h1 { font-size: 1.6rem; margin: 0 0 1.25rem; }
    table { width: 100%; border-collapse: collapse; background: var(--card);
            border-radius: 10px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    th, td { padding: 0.6rem 0.75rem; text-align: left; font-size: 0.85rem;
             border-bottom: 1px solid #eef2f7; }
    th { background: #f1f5f9; color: var(--muted); text-transform: uppercase;
         letter-spacing: 0.04em; font-size: 0.7rem; }
    tr.ok td:first-child { box-shadow: inset 4px 0 0 #22c55e; }
    tr.bad td:first-child { box-shadow: inset 4px 0 0 #ef4444; }
    .pill { font-weight: 700; padding: 0.1rem 0.5rem; border-radius: 999px; font-size: 0.75rem; }
    .pill.ok { background: var(--ok); color: var(--ok-ink); }
    .pill.bad { background: var(--bad); color: var(--bad-ink); }
  </style>
</head>
<body>
  <h1>Audit Log <span style="color:var(--muted);font-weight:400;font-size:1rem;">(last 100)</span></h1>
  <table>
    <tr><th>Time</th><th>Client</th><th>Tool</th><th>Success</th><th>Latency (ms)</th><th>Result</th></tr>
    {% for e in entries %}
    <tr class="{{ 'ok' if e.success else 'bad' }}">
      <td>{{ e.created_at }}</td>
      <td>{{ e.client_id }}</td>
      <td>{{ e.tool }}</td>
      <td><span class="pill {{ 'ok' if e.success else 'bad' }}">{{ e.success }}</span></td>
      <td>{{ "%.1f"|format(e.latency_ms) }}</td>
      <td>{{ e.result_summary }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
