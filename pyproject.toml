[project]
name = "openstore"
version = "0.1.0"
description = "OpenStore sidecar — installable agentic commerce for any merchant"
readme = "README.md"
authors = [{name = "Joseph Fernando", email = "josephfernando05@proton.me"}]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0,<0.111.0",
    "uvicorn[standard]>=0.29.0,<0.30.0",
    "sqlmodel>=0.0.20,<0.0.21",
    "alembic>=1.13.0,<1.14.0",
    "pydantic>=2.7.0,<2.8.0",
    "pydantic-settings>=2.3.0,<2.4.0",
    "pyyaml>=6.0.1,<6.1.0",
    "python-dotenv>=1.0.1,<1.1.0",
    "razorpay>=1.4.1,<1.5.0",
    "discord.py>=2.3.2,<2.4.0",
    "webauthn>=3.0.0,<4.0.0",
    "cryptography>=49.0.0,<50.0.0",
    "jwcrypto>=1.5.6,<1.6.0",
    "httpx>=0.27.0,<0.28.0",
    "python-json-logger>=2.0.7,<2.1.0",
    "rich>=13.7.0,<14.0.0",
    "typer>=0.12.0,<0.13.0",
    "click>=8.1.0,<8.2.0",
]

[project.optional-dependencies]
razorpay = []
dev = [
    "pytest>=8.2.0,<8.3.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-cov>=5.0.0,<5.1.0",
    "ruff>=0.5.0,<0.6.0",
    "mypy>=1.10.0,<1.11.0",
    "pre-commit>=3.7.0,<3.8.0",
]

[project.scripts]
openstore = "openstore.cli:app"
openstore-verify = "openstore.verify.cli:verify_app"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# `razorpay` ships no stubs/py.typed marker (R0.2 note: identifiers come from
# REGISTRY.json, not from the PSP SDK). Treat it as untyped so driver calls
# resolve to Any without import-untyped noise; driver-level asserts still apply.
module = ["razorpay.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260815",
]
