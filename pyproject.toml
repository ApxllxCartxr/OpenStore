[project]
name = "openstore"
version = "0.1.0"
description = "OpenStore sidecar — installable agentic commerce for any merchant"
authors = [{name = "Joseph Fernando", email = "josephfernando05@proton.me"}]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110.0,<0.111.0",
    "uvicorn[standard]>=0.29.0,<0.30.0",
    "sqlmodel>=0.0.20,<0.0.21",
    "alembic>=1.13.0,<1.14.0",
    "pydantic>=2.7.0,<2.8.0",
    "pydantic-settings>=2.3.0,<2.4.0",
    "python-dotenv>=1.0.1,<1.1.0",
    "webauthn>=3.0.0,<4.0.0",
    "cryptography>=49.0.0,<50.0.0",
    "jwcrypto>=1.5.6,<1.6.0",
    "httpx>=0.27.0,<0.28.0",
    "python-json-logger>=2.0.7,<2.1.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "jsonschema>=4.22.0,<4.24.0",
    "aiosqlite>=0.22.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
# `openstore-verify` checks one receipt offline; `openstore-conform` checks one
# store's trait over HTTP. Both are meant to be run by people who do not have
# this repository — which is the whole reason they are entry points rather than
# pytest invocations.
openstore-verify = "openstore.sidecar.verify.cli:main"
openstore-conform = "openstore.sidecar.conform.cli:main"
# The backup drill. A keyfile nobody has restored is a hope, not a backup.
openstore-keys = "openstore.sidecar.evidence.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "openstore"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# `razorpay` ships no stubs/py.typed marker. Treat it as untyped so driver
# calls resolve to Any without import-untyped noise; driver-level asserts
# still apply.
module = ["razorpay.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The repo root, so `scripts/` is importable. A script whose behaviour is only
# reachable by running it is a script nobody tests, and openstore_up.py is the
# install gate.
pythonpath = ["."]

[dependency-groups]
# PEP 735 group: `uv sync` installs this by default, so a fresh clone can run
# every check. (On `main` this lived in an optional-dependencies extra, which
# `uv sync` skips — pytest-asyncio went missing and 137 async tests silently
# SKIPPED rather than failing.)
dev = [
    "pytest>=8.2.0,<8.3.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-cov>=5.0.0,<5.1.0",
    "ruff>=0.5.0,<0.6.0",
    "mypy>=1.10.0,<1.11.0",
    "hypothesis>=6.167.1",
    "mutmut>=3.7.0",
]
