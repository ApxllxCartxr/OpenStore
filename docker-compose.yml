# The demo, as five services (§10). Mount paths and the origin contract are the
# product; the public demo runs the same split on Fly.io as three apps, because
# Fly scopes secrets per app rather than per process (ADR-0019).
#
# `store` and `buyer-chat` are built by their own phases (B1, C1). Until then
# Caddy's routes for them answer 502, which is the honest answer — the route
# exists, the upstream does not yet.

name: openstore

services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      sidecar:
        condition: service_healthy
    networks:
      default:
        aliases:
          # `*.localhost` resolves to the container's OWN loopback inside a
          # container, not to the edge (§10.1). A service that fetches the
          # demo's public URL — the chat fetching a shop card — needs the name
          # to mean Caddy here, or it dials itself and gets nothing.
          - spoiledduckie.localhost
          - dogeared.localhost
          - chat.localhost
    restart: unless-stopped

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # One deploy, one Merchant domain (ADR-0007).
      OPENSTORE_MERCHANT_DOMAIN: spoiledduckie.localhost
      OPENSTORE_PUBLIC_ORIGIN: http://spoiledduckie.localhost
      WEBAUTHN_RP_ID: spoiledduckie.localhost
      WEBAUTHN_RP_NAME: SpoiledDuckie
      SIDECAR_DATABASE_URL: postgresql+psycopg://sc_app:sc_app_dev@postgres:5432/sidecar
      STORE_INTERNAL_URL: http://store:3000
      # The ORIGIN, not the /trait prefix: the client appends `/trait/<door>`
      # itself, and doubling it produces /trait/trait/catalog.read.
      TRAIT_BASE_URL: http://store:3000
      # Both sides of the trait need the same secret. Setting it on the store
      # alone gives the sidecar nothing to sign with, and every door refuses.
      TRAIT_HMAC_SECRET: conformance-secret
      PAYMENT_PROVIDER: fake
      # Pseudonymous consumer ids (ADR-0011). Demo value; a real deploy
      # generates one and rotating it unlinks old orders from new.
      DEPLOY_PSEUDONYM_KEY: demo-deploy-pseudonym-key-32bytes
      # The second admission route (ADR-0012). Self-registration needs no
      # Merchant action; these are for an agent the Merchant has issued
      # credentials to, and without them that route refuses everyone.
      OAUTH_CLIENT_ID: demo-agent
      OAUTH_CLIENT_SECRET: demo-agent-secret
      # The Merchant's signing keys, on a volume because they ARE the Merchant's
      # identity: a key regenerated on each boot breaks every agent that pinned
      # the last one and orphans every receipt already sealed (ADR-0014).
      SIDECAR_SIGNING_KEY_PATH: /keys/signing-keys.json
      OPENSTORE_DEMO_MODE: "true"
      # The SSRF exception, for the compose demo's own chat and nothing else
      # (§10.1). Boot is refused if this is set alongside live provider keys.
      OPENSTORE_DEV_PROFILE_HOSTS: buyer-chat:3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - sidecarkeys:/keys
    expose:
      - "8000"
    restart: unless-stopped

  store:
    build:
      context: .
      dockerfile: demo/merchant-site/Dockerfile
    environment:
      PORT: "3000"
      MERCHANT_DATABASE_URL: postgresql://sd_app:sd_app_dev@postgres:5432/spoiledduckie
      TRAIT_HMAC_SECRET: conformance-secret
      SIDECAR_INTERNAL_URL: http://sidecar:8000
      OPENSTORE_PUBLIC_ORIGIN: http://spoiledduckie.localhost
      ADMIN_SEED_PASSWORD: demo-operator-pw
      # adapter-node assumes https when no protocol header is named, so the
      # origin it computes is https://<host> while the browser posts from
      # http://<host> — and SvelteKit's CSRF check refuses every form on the
      # demo's plain-http origins. Caddy sets this header; honour it.
      PROTOCOL_HEADER: x-forwarded-proto
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      # Loopback only, and deliberately: the nine doors live here and the edge
      # refuses them. This is the private network, for the seed script and the
      # conformance suite. Never bind it to 0.0.0.0.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  # The second shop, and the point of it: the same two images as above with a
  # different domain, a different database and a different catalogue. Nothing
  # is forked — `sidecar-books` is the sidecar image, `store-books` is the
  # merchant-site image, and everything that differs is an environment
  # variable. A shop that needed its own build would mean this site is one
  # shop with a schema rather than a template (ADR-0007: one deploy, one
  # Merchant domain).
  sidecar-books:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENSTORE_MERCHANT_DOMAIN: dogeared.localhost
      OPENSTORE_PUBLIC_ORIGIN: http://dogeared.localhost
      WEBAUTHN_RP_ID: dogeared.localhost
      WEBAUTHN_RP_NAME: Dog-Eared
      SIDECAR_DATABASE_URL: postgresql+psycopg://scb_app:scb_app_dev@postgres:5432/sidecar_books
      STORE_INTERNAL_URL: http://store-books:3000
      TRAIT_BASE_URL: http://store-books:3000
      TRAIT_HMAC_SECRET: conformance-secret-books
      PAYMENT_PROVIDER: fake
      # Its own pseudonym key: the same Consumer must not be linkable across
      # two Merchants by a shared id (ADR-0011).
      DEPLOY_PSEUDONYM_KEY: demo-books-pseudonym-key-32bytes
      OAUTH_CLIENT_ID: demo-agent
      OAUTH_CLIENT_SECRET: demo-agent-secret-books
      # Its own keys on its own volume. Two Merchants sharing a signing key
      # would make either one able to seal the other's receipts.
      SIDECAR_SIGNING_KEY_PATH: /keys/signing-keys.json
      OPENSTORE_DEMO_MODE: "true"
      OPENSTORE_DEV_PROFILE_HOSTS: buyer-chat:3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - booksidecarkeys:/keys
    expose:
      - "8000"
    restart: unless-stopped

  store-books:
    build:
      context: .
      dockerfile: demo/merchant-site/Dockerfile
    environment:
      PORT: "3000"
      MERCHANT_DATABASE_URL: postgresql://de_app:de_app_dev@postgres:5432/dogeared
      TRAIT_HMAC_SECRET: conformance-secret-books
      SIDECAR_INTERNAL_URL: http://sidecar-books:8000
      OPENSTORE_PUBLIC_ORIGIN: http://dogeared.localhost
      ADMIN_SEED_PASSWORD: demo-operator-pw
      # Which shop this deploy is. Read at runtime by `src/lib/brand.ts`, so
      # the image is the one built for SpoiledDuckie.
      PUBLIC_SHOP_NAME: Dog-Eared
      PUBLIC_SHOP_TAGLINE: "Books, secondhand and new, off Bidhan Sarani."
      PUBLIC_SHOP_BLURB: a bookshop in Kolkata
      PUBLIC_SHOP_ACCENT: "#6f9a8d"
      SEED_PROFILE: dogeared
      PROTOCOL_HEADER: x-forwarded-proto
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      # Loopback only, like the first shop's: the nine doors live here and the
      # edge refuses them.
      - "127.0.0.1:3010:3000"
    restart: unless-stopped

  buyer-chat:
    build:
      context: .
      dockerfile: demo/buyer-chat/Dockerfile
    # Provider keys live in `.env.llm`, which Compose does not read for
    # interpolation the way it reads `.env` — so the file is mounted as an
    # env_file instead. Both are optional: a machine with neither still boots,
    # and the driver below still defaults to the pinned planner.
    #
    # An `environment:` entry would WIN over these, so OPENROUTER_API_KEY is
    # deliberately absent from the block below: naming it there as
    # `${OPENROUTER_API_KEY:-}` resolves to the empty string when the shell has
    # not exported it, and quietly overwrites the key this file just supplied.
    env_file:
      - path: .env.llm
        required: false
      - path: .env
        required: false
    environment:
      PORT: "3001"
      # A real model when a key is present, the pinned planner otherwise. The
      # demo must still run end to end with no key and no network to a model —
      # a demo that needs somebody's API key to pass its own tests is one that
      # fails on the next laptop.
      CHAT_MODEL_DRIVER: ${CHAT_MODEL_DRIVER:-scripted}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-20b}
      CHAT_DATABASE_PATH: /data/chat.db
      CHAT_KEY_PATH: /data/agent-key.json
      # The chat reaches the sidecar through Caddy carrying the real Host
      # header: a card fetched as http://caddy/ would advertise the wrong
      # origin back to the browser (§10.1).
      SIDECAR_PUBLIC_ORIGIN: http://spoiledduckie.localhost
      # The chat dials the shop by its own domain (the edge answers to it on
      # this network), and names it as the one host it may reach over plain
      # http — the mirror of the sidecar's own exception.
      OPENSTORE_DEV_PROFILE_HOSTS: spoiledduckie.localhost,dogeared.localhost
      # adapter-node assumes https when no protocol header is named, so the
      # origin it computes is https://<host> while the browser posts from
      # http://<host> — and SvelteKit's CSRF check refuses every form on the
      # demo's plain-http origins. Caddy sets this header; honour it.
      PROTOCOL_HEADER: x-forwarded-proto
      NODE_ENV: production
    volumes:
      - chatdata:/data
    expose:
      - "3001"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres_dev
    ports:
      # Published for local development and the seed script. The compose network
      # is how the services actually reach it; this is for a human with psql.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  chatdata:
  sidecarkeys:
  booksidecarkeys:
