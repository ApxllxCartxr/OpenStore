# The demo, as five services (§10). Mount paths and the origin contract are the
# product; the public demo runs the same split on Fly.io as three apps, because
# Fly scopes secrets per app rather than per process (ADR-0019).
#
# `store` and `buyer-chat` are built by their own phases (B1, C1). Until then
# Caddy's routes for them answer 502, which is the honest answer — the route
# exists, the upstream does not yet.

name: openstore

services:
  caddy:
    image: caddy:2.8-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      sidecar:
        condition: service_healthy
    restart: unless-stopped

  sidecar:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # One deploy, one Merchant domain (ADR-0007).
      OPENSTORE_MERCHANT_DOMAIN: spoiledduckie.localhost
      OPENSTORE_PUBLIC_ORIGIN: http://spoiledduckie.localhost
      WEBAUTHN_RP_ID: spoiledduckie.localhost
      WEBAUTHN_RP_NAME: SpoiledDuckie
      SIDECAR_DATABASE_URL: postgresql+psycopg://sc_app:sc_app_dev@postgres:5432/sidecar
      STORE_INTERNAL_URL: http://store:3000
      TRAIT_BASE_URL: http://store:3000/trait
      PAYMENT_PROVIDER: fake
      OPENSTORE_DEMO_MODE: "true"
      # The SSRF exception, for the compose demo's own chat and nothing else
      # (§10.1). Boot is refused if this is set alongside live provider keys.
      OPENSTORE_DEV_PROFILE_HOSTS: buyer-chat:3001
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  store:
    build:
      context: .
      dockerfile: demo/merchant-site/Dockerfile
    environment:
      PORT: "3000"
      MERCHANT_DATABASE_URL: postgresql://sd_app:sd_app_dev@postgres:5432/spoiledduckie
      TRAIT_HMAC_SECRET: conformance-secret
      SIDECAR_INTERNAL_URL: http://sidecar:8000
      OPENSTORE_PUBLIC_ORIGIN: http://spoiledduckie.localhost
      ADMIN_SEED_PASSWORD: demo-operator-pw
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    ports:
      # Loopback only, and deliberately: the nine doors live here and the edge
      # refuses them. This is the private network, for the seed script and the
      # conformance suite. Never bind it to 0.0.0.0.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  buyer-chat:
    build:
      context: .
      dockerfile: demo/buyer-chat/Dockerfile
    environment:
      PORT: "3001"
      CHAT_MODEL_DRIVER: scripted
      CHAT_DATABASE_PATH: /data/chat.db
      CHAT_KEY_PATH: /data/agent-key.json
      # The chat reaches the sidecar through Caddy carrying the real Host
      # header: a card fetched as http://caddy/ would advertise the wrong
      # origin back to the browser (§10.1).
      SIDECAR_PUBLIC_ORIGIN: http://spoiledduckie.localhost
      SIDECAR_VIA: http://caddy
      NODE_ENV: production
    volumes:
      - chatdata:/data
    expose:
      - "3001"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres_dev
    ports:
      # Published for local development and the seed script. The compose network
      # is how the services actually reach it; this is for a human with psql.
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  chatdata:
