<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders — OpenStore</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono/index.css">
<style>
  :root {
    --bg:#fafafa; --surface:#ffffff; --ink:#18181b; --muted:#71717a; --subtle:#a1a1aa;
    --line:#e4e4e7; --accent:#18181b; --accent-ink:#fafafa;
    --ok-bg:#ecfdf5; --ok-ink:#065f46;
    --warn-bg:#fffbeb; --warn-ink:#92400e;
    --err-bg:#fef2f2; --err-ink:#991b1b;
    --mute-bg:#f4f4f5; --mute-ink:#52525b;
    --radius:14px; --shadow:0 1px 2px rgba(24,24,27,.04), 0 8px 24px -12px rgba(24,24,27,.08);
    --font-sans:'Geist Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  * { box-sizing:border-box; }
  body {
    font-family:var(--font-sans); color:var(--ink); background:var(--bg);
    max-width:960px; margin:0 auto; padding:3.5rem 1.5rem 4rem; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1 { font-size:1.6rem; font-weight:600; letter-spacing:-.02em; margin:0 0 .4rem; }
  p.lede { color:var(--muted); font-size:.95rem; margin:0 0 2rem; max-width:64ch; }
  .toolbar {
    display:flex; align-items:center; gap:.75rem; margin-bottom:1.25rem;
    font-size:.85rem; color:var(--muted);
  }
  .toolbar input {
    font-family:inherit; font-size:.85rem; padding:.4rem .6rem; border:1px solid var(--line);
    border-radius:8px; background:var(--surface); color:var(--ink); width:6rem;
  }
  .toolbar button {
    font-family:inherit; font-size:.82rem; font-weight:600; padding:.4rem .8rem;
    border-radius:8px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); cursor:pointer;
  }
  .toolbar button:hover { opacity:.8; }
  table {
    width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
  }
  thead th {
    text-align:left; font-size:.72rem; font-weight:600; text-transform:uppercase;
    letter-spacing:.04em; color:var(--muted); padding:.7rem 1rem; border-bottom:1px solid var(--line);
    background:var(--mute-bg);
  }
  tbody td {
    padding:.7rem 1rem; border-bottom:1px solid var(--line); font-size:.87rem; vertical-align:middle;
  }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:hover { background:var(--mute-bg); }
  td.mono, th.mono { font-family:var(--font-mono); font-size:.8rem; }
  td.amount { font-family:var(--font-mono); font-weight:600; white-space:nowrap; }
  .state {
    display:inline-block; padding:.2rem .55rem; border-radius:6px; font-size:.72rem;
    font-family:var(--font-mono); font-weight:500; letter-spacing:.02em;
  }
  .state-HELD, .state-PENDING { background:var(--warn-bg); color:var(--warn-ink); }
  .state-RELEASED, .state-PAID { background:var(--ok-bg); color:var(--ok-ink); }
  .state-CANCELLED, .state-EXPIRED, .state-FAILED { background:var(--err-bg); color:var(--err-ink); }
  .state-DRAFT { background:var(--mute-bg); color:var(--mute-ink); }
  a.evidence {
    color:var(--ink); font-size:.8rem; font-weight:600; text-decoration:none;
    border-bottom:1px solid var(--ink);
  }
  a.evidence:hover { opacity:.7; }
  .empty {
    color:var(--subtle); font-size:.92rem; text-align:center; padding:3rem 1rem;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  }
  .id-cell { max-width:11rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  footer { margin-top:2rem; color:var(--subtle); font-size:.8rem; max-width:60ch; }
</style>
</head>
<body>
<h1>Orders</h1>
<p class="lede">Every checkout this merchant has processed, newest first. Read-only —
no mutating action lives on this page.</p>

<div class="toolbar">
  <label for="limit-input">Show</label>
  <input id="limit-input" type="number" min="1" max="500" value="__LIMIT__">
  <button id="reload-btn">Reload</button>
</div>

<div id="table-wrap"></div>

<footer>
Amounts are in minor units of the merchant's settlement currency (paise for INR),
rendered here as ₹. An evidence link appears once a checkout has a PoAI bundle attached.
</footer>

<script>
"use strict";
const OPERATOR = __OPERATOR_ID__;
let ORDERS = __ORDERS_JSON__;

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function fmtAmount(minor) {
  if (minor === null || minor === undefined) return "—";
  return "₹" + (minor / 100).toFixed(2);
}

function fmtDate(iso) {
  if (!iso) return "—";
  return iso.slice(0, 16).replace("T", " ");
}

function render() {
  const el = document.getElementById("table-wrap");
  if (!ORDERS.length) {
    el.innerHTML = '<div class="empty">No orders yet.</div>';
    return;
  }
  const rows = ORDERS.map(o => {
    const evidence = o.evidence_url
      ? '<a class="evidence" href="' + esc(o.evidence_url) + '">View</a>'
      : '<span style="color:var(--subtle)">—</span>';
    return '<tr>' +
      '<td class="mono id-cell" title="' + esc(o.checkout_id) + '">' + esc(o.checkout_id) + '</td>' +
      '<td><span class="state state-' + esc(o.state) + '">' + esc(o.state) + '</span></td>' +
      '<td class="amount">' + fmtAmount(o.amount_minor) + '</td>' +
      '<td class="mono">' + esc(o.policy_id || "—") + '</td>' +
      '<td class="mono">' + esc(o.chat_user_id || "—") + '</td>' +
      '<td class="mono">' + fmtDate(o.created_at) + '</td>' +
      '<td class="mono">' + fmtDate(o.expires_at) + '</td>' +
      '<td>' + evidence + '</td>' +
    '</tr>';
  }).join("");
  el.innerHTML =
    '<table><thead><tr>' +
      '<th>Checkout</th><th>State</th><th>Amount</th><th class="mono">Policy</th>' +
      '<th class="mono">Chat user</th><th class="mono">Created</th><th class="mono">Expires</th>' +
      '<th>Evidence</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

document.getElementById("reload-btn").addEventListener("click", async () => {
  const limit = document.getElementById("limit-input").value || 50;
  const res = await fetch("/admin/orders?limit=" + encodeURIComponent(limit), {
    headers: { "X-Operator-Id": OPERATOR },
  });
  const data = await res.json();
  ORDERS = data.orders || [];
  render();
});

render();
</script>
</body>
</html>
