<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campaign Studio</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .campaign { border: 1px solid #ccc; padding: 1rem; margin: 0.5rem 0; border-radius: 4px; }
    .draft { background: #f9f9f9; }
    .active { background: #e8f5e9; border-color: #4caf50; }
    .btn { background: #1976d2; color: white; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; }
    .btn:hover { background: #1565c0; }
  </style>
</head>
<body>
  <h1>Campaign Studio</h1>
  <div id="campaigns"></div>
  <script>
    async function loadCampaigns() {
      const r = await fetch('/agent/campaigns');
      const data = await r.json();
      const el = document.getElementById('campaigns');
      if (!data.campaigns || !data.campaigns.length) {
        el.innerHTML = '<p>No campaigns. Draft one via the campaign agent.</p>';
        return;
      }
      el.innerHTML = data.campaigns.map(c => `
        <div class="campaign ${c.state.toLowerCase()}">
          <h3>${c.title} (${c.state})</h3>
          <p>${c.discount_bps / 100}% off</p>
          <p>SKUs: ${(c.applies_to_skus || []).join(', ')}</p>
        </div>
      `).join('');
    }
    loadCampaigns();
  </script>
</body>
</html>
