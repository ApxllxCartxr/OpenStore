<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart Approval — OpenStore</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono/index.css">
<style>
  :root{
    --muted:#71717a;--line:#e4e4e7;--bg:#fafafa;--surface:#fff;--ink:#18181b;
    --ok:#16a34a;--err:#dc2626;--shadow:0 1px 2px rgba(24,24,27,.04),0 8px 24px -14px rgba(24,24,27,.10);
    --font-sans:'Geist Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans);color:var(--ink);background:var(--bg);padding:3rem 1.25rem 4rem;
       max-width:640px;margin:0 auto;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1{font-size:1.5rem;font-weight:600;letter-spacing:-.02em;margin-bottom:.4rem}
  p.lede{color:var(--muted);font-size:.9rem;margin-bottom:1.75rem;max-width:56ch}
  .panel{border:1px solid var(--line);border-radius:14px;padding:1.25rem;margin-bottom:1rem;
         background:var(--surface);box-shadow:var(--shadow)}
  .panel h2{font-size:.85rem;font-weight:600;margin-bottom:.75rem;color:var(--muted);
            text-transform:uppercase;letter-spacing:.02em}
  dl{display:grid;grid-template-columns:auto 1fr;gap:.5rem .9rem;font-size:.88rem}
  dt{color:var(--muted)}
  .buttons{display:flex;gap:.75rem}
  button{border:0;border-radius:9px;padding:.65rem 1.15rem;cursor:pointer;font-size:.9rem;
         font-weight:600;font-family:var(--font-sans);transition:opacity .15s}
  button:hover{opacity:.85}
  #approve-btn{background:var(--ok);color:#fff}
  #reject-btn{background:var(--err);color:#fff}
  #status{margin-top:1.25rem;font-size:.83rem;font-family:var(--font-mono);white-space:pre-wrap;color:var(--muted)}
</style>
</head>
<body>
<h1>Cart approval</h1>
<p class="lede">Approve this exact cart with your passkey. The signature is bound to the cart hash — it cannot be replayed onto a different cart. Approval grades this order at AAL2.</p>

<div class="panel">
  <h2>Pending cart</h2>
  <dl>
    <dt>Cart ID</dt><dd id="cart-id"></dd>
    <dt>Items</dt><dd id="cart-items"></dd>
    <dt>Cart hash</dt><dd id="cart-hash" style="font-family:var(--font-mono);font-size:.78rem"></dd>
  </dl>
</div>

<div class="buttons">
  <button id="approve-btn" onclick="decide('approve')">Approve</button>
  <button id="reject-btn" onclick="decide('reject')">Reject</button>
</div>
<div id="status"></div>

<script>
const CART_ID = __CART_ID__;
const HANDOFF_TOKEN = __HANDOFF_TOKEN__;
const CART = __CART_JSON__;
// Challenge issued server-side while rendering this page (bound to
// {"mode":"cart","cart_hash":...}) — no separate "begin" HTTP round trip.
const ASSERTION_BEGIN = __ASSERTION_BEGIN_JSON__;

document.getElementById("cart-id").textContent = CART_ID;
document.getElementById("cart-items").textContent =
  (CART || []).map(i => `${i.qty || 1}× ${i.sku}`).join(", ") || "empty";
document.getElementById("cart-hash").textContent = ASSERTION_BEGIN.binding
  ? ASSERTION_BEGIN.binding.cart_hash : "?";

function b64uToBuf(s) {
  const pad = "=".repeat((4 - s.length % 4) % 4);
  const bin = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr.buffer;
}
function bufToB64u(buf) {
  const bytes = new Uint8Array(buf);
  let bin = "";
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function decide(action) {
  const status = document.getElementById("status");
  if (action === "reject") {
    const res = await fetch(`/intent/cart/${CART_ID}/reject`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({token: HANDOFF_TOKEN}),
    });
    status.textContent = JSON.stringify(await res.json(), null, 2);
    return;
  }

  try {
    const cred = await navigator.credentials.get({
      publicKey: {
        challenge: b64uToBuf(ASSERTION_BEGIN.challenge),
        rpId: ASSERTION_BEGIN.rpId,
        allowCredentials: (ASSERTION_BEGIN.allowCredentials || []).map(c => ({
          id: b64uToBuf(c.id), type: "public-key",
        })),
        userVerification: "required",
      },
    });

    const payload = {
      token: HANDOFF_TOKEN,
      credential_id: cred.id,
      client_data_json: bufToB64u(cred.response.clientDataJSON),
      authenticator_data: bufToB64u(cred.response.authenticatorData),
      signature: bufToB64u(cred.response.signature),
      challenge: ASSERTION_BEGIN.challenge,
    };

    const res = await fetch(`/intent/cart/${CART_ID}/approve`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload),
    });
    status.textContent = JSON.stringify(await res.json(), null, 2);
  } catch (e) {
    status.textContent = "Error: " + e.message;
  }
}
</script>
</body>
</html>
