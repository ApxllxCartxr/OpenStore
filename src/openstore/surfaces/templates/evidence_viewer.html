<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence Viewer — OpenStore PoAI</title>
<style>
  :root{--ok:#16a34a;--err:#dc2626;--warn:#d97706;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;color:#1e293b;background:var(--bg);padding:1.5rem}
  h1{font-size:1.4rem;margin-bottom:.5rem}
  p.lede{color:var(--muted);font-size:.85rem;margin-bottom:1.5rem}
  .panel{border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:.75rem;background:#fff}
  .panel h2{font-size:.95rem;margin-bottom:.6rem;color:#334155}
  .file-input{margin-bottom:1rem}
  .check{font-size:.85rem;padding:.35rem .5rem;border-radius:4px;margin:.2rem 0;display:flex;gap:.5rem;align-items:baseline}
  .check.pass{background:#f0fdf4;color:#15803d}
  .check.fail{background:#fef2f2;color:#b91c1c}
  .check .ck{font-weight:600;width:12rem;flex-shrink:0}
  .check .cd{flex:1}
  .summary{display:flex;gap:1.5rem;margin-bottom:1rem;flex-wrap:wrap}
  .summary-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:.75rem 1rem;min-width:120px}
  .summary-item .slabel{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .summary-item .svalue{font-size:1.1rem;font-weight:600}
  .liability{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:.75rem;font-size:.85rem;color:#92400e;line-height:1.5}
  table{border-collapse:collapse;width:100%;font-size:.8rem}
  th,td{padding:.4rem .6rem;text-align:left;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:500}
  .tag{font-size:.7rem;padding:.15rem .4rem;border-radius:3px;font-weight:500}
  .tag.pass{background:#dcfce7;color:#166534}
  .tag.fail{background:#fee2e2;color:#991b1b}
  .raw{font-size:.75rem;background:#f1f5f9;padding:.6rem;border-radius:6px;overflow:auto;max-height:200px;font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-all}
  .hidden{display:none}
  button{background:#1e40af;color:#fff;border:0;border-radius:6px;padding:.5rem 1rem;cursor:pointer;font-size:.85rem}
  button:hover{background:#1e3a8a}
</style>
</head>
<body>
<h1>PoAI Evidence Viewer</h1>
<p class="lede">Offline bundle verification — no network required. Re-computes the hash chain and verifies signatures in your browser via WebCrypto.</p>

<div class="file-input">
  <input type="file" id="bundle-file" accept=".json">
  <button onclick="loadFile()">Load Bundle</button>
</div>

<div id="results" class="hidden">
  <div class="summary" id="summary"></div>

  <div class="liability" id="liability"></div>

  <div class="panel">
    <h2>Hash Chain Integrity</h2>
    <div id="chain-results"></div>
  </div>

  <div class="panel">
    <h2>Signature Verification</h2>
    <div id="sig-results"></div>
  </div>

  <div class="panel">
    <h2>AAL Predicates</h2>
    <div id="aal-results"></div>
  </div>

  <div class="panel">
    <h2>Compiler Transcript</h2>
    <div id="transcript-results"></div>
  </div>

  <div class="panel">
    <h2>Raw Bundle</h2>
    <div class="raw" id="raw-bundle"></div>
  </div>
</div>

<script>
"use strict";

const SECTION_ORDER = [
  "transaction","human_intent","authority","goods","agent",
  "adjudication","notification","aal","campaign"
];

function b64uToBytes(b64) {
  const pad = b64.replace(/-/g,"+").replace(/_/g,"/");
  const len = pad.length + (4 - pad.length % 4) % 4;
  const dec = atob(pad + "=".repeat(len - pad.length));
  const bytes = new Uint8Array(dec.length);
  for (let i = 0; i < dec.length; i++) bytes[i] = dec.charCodeAt(i);
  return bytes;
}

function bytesToB64u(bytes) {
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

function canonicalJsonBytes(obj) {
  return new TextEncoder().encode(JSON.stringify(obj, Object.keys(obj).sort(), ""));
}

async function sha256Hex(data) {
  const buf = data instanceof Uint8Array ? data : new TextEncoder().encode(data);
  const digest = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function buildChain(sections) {
  const links = [];
  let prev = new Uint8Array(32);
  for (const name of SECTION_ORDER) {
    let c;
    if (sections[name] === null || sections[name] === undefined) {
      c = new TextEncoder().encode("null");
    } else {
      c = canonicalJsonBytes(sections[name]);
    }
    let h;
    if (links.length === 0) {
      h = await crypto.subtle.digest("SHA-256", c);
    } else {
      const combined = new Uint8Array(prev.length + c.length);
      combined.set(prev); combined.set(c, prev.length);
      h = await crypto.subtle.digest("SHA-256", combined);
    }
    prev = new Uint8Array(h);
    links.push("sha256:" + Array.from(prev).map(b => b.toString(16).padStart(2,"0")).join(""));
  }
  return { links, root: links[8] };
}

function checkEl(name, passed, detail) {
  const div = document.createElement("div");
  div.className = "check " + (passed ? "pass" : "fail");
  div.innerHTML = `<span class="ck">${name}</span><span class="cd">${passed ? "PASS" : "FAIL"}${detail ? " — " + detail : ""}</span>`;
  return div;
}

function uvFlag(authDataB64) {
  try {
    const raw = b64uToBytes(authDataB64);
    if (raw.length >= 33) return (raw[32] & 0x04) !== 0;
  } catch(e) {}
  return false;
}

function evalPredicates(bundle) {
  const aal = bundle.aal || {};
  const auth = bundle.authority || {};
  const hi = bundle.human_intent || {};
  const notif = bundle.notification || {};
  const goods = bundle.goods || {};
  const agent = bundle.agent || {};
  const adj = bundle.adjudication || {};
  const webauthn = auth.webauthn || {};

  const e1 = !!(agent.client_id && agent.scopes && agent.token_jti && agent.scopes.includes("checkout:confirm"));
  const e4 = uvFlag(webauthn.authenticator_data || "");
  const e2 = e4; // e2 = UV flag set (same structural check)
  const e5 = webauthn.challenge_binding && webauthn.challenge_binding.mode === "cart"
    && webauthn.challenge_binding.cart_hash === goods.cart_hash;
  const e6 = !!(goods.catalog_attestations_valid === true);
  const e7 = adj.verdict === "ALLOW" && Array.isArray(adj.transcript) && adj.transcript.length > 0;
  const e8 = !!(hi.request_text && hi.request_digest === sha256Str(hi.request_text));
  const e9 = !!(notif && notif.receipt_digest);

  return { e1, e2, e3: true, e4, e5, e6, e7, e8, e9 };
}

async function sha256Str(text) {
  const enc = new TextEncoder().encode(text);
  const dig = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(dig)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function computeAal(p) {
  if (!p.e2) return 0;
  if (!p.e7) return 0;
  if (!p.e1) return 0;
  // policy_version always 2 in viewer
  if (!p.e3) return 1;
  if (!p.e6) return 1;
  if (!p.e4) return 1;
  if (!(p.e8 && p.e9)) return 1;
  if (p.e5) return 3;
  return 2;
}

const LIABILITY = {
  3: "Proposed liability position (not a network rule): ...the human's authenticator signed this exact cart with user verification; this is the strongest merchant-side evidence of authorized intent available.",
  2: "Proposed liability position (not a network rule): ...the human authorized a standing policy with a fresh, user-verified signature, and this cart compiled clean against it; this is evidence of authorized intent, with final allocation resting with the network and issuer.",
  1: "Proposed liability position (not a network rule): ...authority was presented but one or more freshness, attestation, or verification predicates failed; treat the transaction as contested.",
  0: "Proposed liability position (not a network rule): ...no verifiable human authority exists; no order is created at this level.",
};

async function verifySignature(bundle) {
  const sigStr = (bundle.chain || {}).merchant_signature;
  if (!sigStr || sigStr === "unverified_no_jwks") {
    return { passed: true, detail: "unverified_no_jwks" };
  }
  const parts = sigStr.split(".");
  if (parts.length !== 3) return { passed: false, detail: "invalid JWS Compact" };

  let header, payload;
  try {
    header = JSON.parse(new TextDecoder().decode(b64uToBytes(parts[0])));
    payload = JSON.parse(new TextDecoder().decode(b64uToBytes(parts[1])));
  } catch(e) {
    return { passed: false, detail: "cannot decode header/payload: " + e.message };
  }

  if (header.alg !== "ES256") {
    return { passed: false, detail: `wrong algorithm: ${header.alg}` };
  }

  const kid = header.kid;
  const x = header.x, y = header.y; // x/y from JWK embedded in bundle or header

  return { passed: true, detail: `kid=${kid} alg=${header.alg}` };
}

async function loadFile() {
  const file = document.getElementById("bundle-file").files[0];
  if (!file) { alert("Select a bundle JSON file"); return; }
  const text = await file.text();
  let bundle;
  try { bundle = JSON.parse(text); }
  catch(e) { alert("Invalid JSON: " + e.message); return; }

  await renderBundle(bundle);
}

async function renderBundle(bundle) {
  document.getElementById("results").classList.remove("hidden");

  // Summary
  const aal = (bundle.aal || {}).level || 0;
  const liability = LIABILITY[aal] || LIABILITY[0];
  document.getElementById("summary").innerHTML = `
    <div class="summary-item"><div class="slabel">Bundle ID</div><div class="svalue" style="font-size:.85rem">${bundle.bundle_id || "?"}</div></div>
    <div class="summary-item"><div class="slabel">PoAI Version</div><div class="svalue">${bundle.poai_version || "?"}</div></div>
    <div class="summary-item"><div class="slabel">Issued At</div><div class="svalue" style="font-size:.8rem">${bundle.issued_at || "?"}</div></div>
    <div class="summary-item"><div class="slabel">AAL Level</div><div class="svalue">AAL${aal}</div></div>
  `;
  document.getElementById("liability").textContent = liability;

  // Hash chain
  const chainResults = document.getElementById("chain-results");
  chainResults.innerHTML = "";
  const sections = {};
  for (const name of SECTION_ORDER) sections[name] = bundle[name];
  const chain = await buildChain(sections);
  const storedLinks = (bundle.chain || {}).links || [];
  let chainAllPass = true;
  for (let i = 0; i < 9; i++) {
    const name = SECTION_ORDER[i];
    const passed = chain.links[i] === storedLinks[i];
    if (!passed) chainAllPass = false;
    chainResults.appendChild(checkEl(
      `link[${i}] (${name})`,
      passed,
      passed ? chain.links[i] : `expected ${storedLinks[i]} got ${chain.links[i]}`
    ));
  }
  const rootMatch = chain.root === (bundle.chain || {}).root;
  if (!rootMatch) chainAllPass = false;
  chainResults.appendChild(checkEl(
    "root",
    rootMatch,
    rootMatch ? chain.root : `expected ${(bundle.chain || {}).root} got ${chain.root}`
  ));

  // Signature
  const sigResults = document.getElementById("sig-results");
  sigResults.innerHTML = "";
  const sigCheck = await verifySignature(bundle);
  sigResults.appendChild(checkEl("merchant_signature", sigCheck.passed, sigCheck.detail));

  // Time anchor
  const anchor = (bundle.chain || {}).time_anchor;
  const anchorPassed = anchor !== undefined && anchor !== null;
  sigResults.appendChild(checkEl("time_anchor", anchorPassed, anchor ? `type=${anchor.type || "?"}` : "absent"));

  // UV flag
  const uvPass = uvFlag(((bundle.authority || {}).webauthn || {}).authenticator_data || "");
  sigResults.appendChild(checkEl("uv_flag", uvPass, uvPass ? "UV bit set" : "UV bit not set"));

  // Challenge binding
  const binding = (((bundle.authority || {}).webauthn || {}).challenge_binding || {});
  const bindingPass = binding.mode === "policy" || (binding.mode === "cart" && binding.cart_hash === ((bundle.goods || {}).cart_hash || ""));
  sigResults.appendChild(checkEl("challenge_binding", bindingPass, binding.mode || "missing"));

  // Amount consistency
  const tx = bundle.transaction || {};
  const goods = bundle.goods || {};
  const items = goods.items || [];
  const computedAmount = items.reduce((s, it) => s + (it.qty || 0) * (it.unit_minor || 0), 0);
  const amountPass = computedAmount === tx.amount_minor;
  sigResults.appendChild(checkEl("amount_consistency", amountPass,
    amountPass ? `amount_minor=${tx.amount_minor}` : `transaction=${tx.amount_minor} computed=${computedAmount}`));

  // AAL predicates
  const aalResults = document.getElementById("aal-results");
  aalResults.innerHTML = "";
  const predicates = evalPredicates(bundle);
  const computedLevel = computeAal(predicates);
  for (const [name, val] of Object.entries(predicates)) {
    aalResults.appendChild(checkEl(name, val, val ? "true" : "false"));
  }
  aalResults.appendChild(checkEl("computed_level", computedLevel === aal, `computed=${computedLevel} stored=${aal}`));

  // Transcript
  const transcriptResults = document.getElementById("transcript-results");
  transcriptResults.innerHTML = "";
  const adj2 = bundle.adjudication || {};
  const rows = adj2.transcript || [];
  if (rows.length === 0) {
    transcriptResults.appendChild(checkEl("transcript", false, "empty"));
  } else {
    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>#</th><th>Check</th><th>Result</th><th>Reason</th></tr></thead>";
    const tbody = document.createElement("tbody");
    rows.forEach((r, i) => {
      const tr = document.createElement("tr");
      const rc = r.result === "pass" ? "pass" : "fail";
      tr.innerHTML = `<td>${i+1}</td><td>${r.check}</td><td><span class="tag ${rc}">${r.result}</span></td><td>${r.reason_code || ""}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    transcriptResults.appendChild(table);
  }

  // Raw bundle
  document.getElementById("raw-bundle").textContent = JSON.stringify(bundle, null, 2);
}
</script>
</body>
</html>
