<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policy Studio — OpenStore</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; }
        .form-group { margin: 1rem 0; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input, textarea, select { width: 100%; padding: 0.5rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        button { background: #0066cc; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #0052a3; }
        .policy-preview { background: #f5f5f5; border-radius: 8px; padding: 1rem; margin-top: 2rem; white-space: pre-wrap; font-family: monospace; font-size: 0.85rem; }
        .step { padding: 1rem; border-left: 4px solid #0066cc; margin: 1rem 0; background: #f0f7ff; }
    </style>
</head>
<body>
    <h1>Policy Studio</h1>
    <p>Create and sign an IntentPolicy with your passkey.</p>

    <div class="step">
        <h3>Step 1: Configure Policy</h3>
        <form id="policy-form">
            <div class="form-group">
                <label>Max spend per transaction (₹)</label>
                <input type="number" id="max_spend_per_tx" value="500" min="1" step="1">
            </div>
            <div class="form-group">
                <label>Max spend total (₹)</label>
                <input type="number" id="max_spend_total" value="2000" min="1" step="1">
            </div>
            <div class="form-group">
                <label>Max transactions</label>
                <input type="number" id="max_transactions" value="10" min="1" step="1">
            </div>
            <div class="form-group">
                <label>Allowed tags (comma-separated, empty = unconstrained)</label>
                <input type="text" id="allowed_tags" placeholder="vegan,gelato" value="vegan,gelato">
            </div>
            <div class="form-group">
                <label>Tag mode</label>
                <select id="tag_mode">
                    <option value="all">all (all tags must match)</option>
                    <option value="any">any (at least one tag must match)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Blocked SKUs (comma-separated)</label>
                <input type="text" id="blocked_skus" placeholder="sku1,sku2">
            </div>
            <div class="form-group">
                <label>Required SKUs (comma-separated, for fulfilment_mode=required_subset)</label>
                <input type="text" id="required_skus" placeholder="sku1,sku2">
            </div>
            <div class="form-group">
                <label>Fulfilment mode</label>
                <select id="fulfilment_mode">
                    <option value="all_or_nothing">all_or_nothing</option>
                    <option value="required_subset">required_subset</option>
                </select>
            </div>
            <div class="form-group">
                <label>Not before (Unix timestamp, 0 = now)</label>
                <input type="number" id="not_before" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Expires at (Unix timestamp, 0 = no expiry)</label>
                <input type="number" id="expires_at" value="0" min="0">
            </div>
            <div class="form-group">
                <label>Assertion max age (seconds)</label>
                <input type="number" id="assertion_max_age" value="86400" min="1">
            </div>
            <button type="submit">Generate Policy & Register Passkey</button>
        </form>
    </div>

    <div class="step">
        <h3>Step 2: Review & Sign</h3>
        <div id="policy-preview" class="policy-preview" style="display:none;"></div>
        <button id="sign-btn" style="display:none;">Sign with Passkey</button>
    </div>

    <script>
        document.getElementById('policy-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const policy = {
                policy_version: 2,
                merchant_ids: ['demo-merchant'],
                currency: 'INR',
                max_spend_per_tx_minor: parseInt(document.getElementById('max_spend_per_tx').value) * 100,
                max_spend_total_minor: parseInt(document.getElementById('max_spend_total').value) * 100,
                max_transactions: parseInt(document.getElementById('max_transactions').value),
                allowed_tags: document.getElementById('allowed_tags').value.split(',').map(s => s.trim()).filter(Boolean),
                tag_mode: document.getElementById('tag_mode').value,
                blocked_skus: document.getElementById('blocked_skus').value.split(',').map(s => s.trim()).filter(Boolean),
                required_skus: document.getElementById('required_skus').value.split(',').map(s => s.trim()).filter(Boolean),
                fulfilment_mode: document.getElementById('fulfilment_mode').value,
                not_before: parseInt(document.getElementById('not_before').value) || Math.floor(Date.now() / 1000),
                expires_at: parseInt(document.getElementById('expires_at').value) || Math.floor(Date.now() / 1000) + 365 * 24 * 3600,
                assertion_max_age_seconds: parseInt(document.getElementById('assertion_max_age').value),
            };
            
            document.getElementById('policy-preview').textContent = JSON.stringify(policy, null, 2);
            document.getElementById('policy-preview').style.display = 'block';
            document.getElementById('sign-btn').style.display = 'inline-block';
            
            window.currentPolicy = policy;
        });

        document.getElementById('sign-btn').addEventListener('click', async () => {
            alert('WebAuthn registration not yet implemented — Stage 3');
        });
    </script>
</body>
</html>
