# Alembic, for the sidecar's own database.
#
# The Merchant's database is not here and never will be: the sidecar owns the
# Ledger, the Transcripts, the evidence and the in-flight state, and reaches
# Merchant truth only through the nine doors (SPEC §5, ADR-0001). A migration
# tool with a connection to both would be the shared database this design does
# not have.
#
# The URL is read from SIDECAR_DATABASE_URL at runtime by `migrations/env.py`,
# not written here: a checked-in connection string is a checked-in password.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
