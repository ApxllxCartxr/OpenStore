# OpenStore Alembic configuration (SID-3, SID-6)
# The database URL is injected at runtime from the OpenStore config by
# alembic/env.py; the sqlalchemy.url placeholder below is never used directly.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# URL is set programmatically in env.py from the OpenStore Settings.
sqlalchemy.url = sqlite:///openstore.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S