# OpenStore configuration
# Fill in all values; unknown keys cause hard failure (R0.3)

merchant:
  name: "Gelateria Milano"
  currency: "INR"

razorpay:
  key_id: "${RAZORPAY_KEY_ID}"
  key_secret: "${RAZORPAY_KEY_SECRET}"
  webhook_secret: "${RAZORPAY_WEBHOOK_SECRET}"

discord:
  bot_token: "${DISCORD_BOT_TOKEN}"
  buyer_trace_channel_id: 1542108166043471945   # buyer-agent-webhooks
  merchant_trace_channel_id: 1542108116894748712 # merchant-bot-hooks
  money_trace_channel_id: 1542108062255419503    # merchant-server-hooks
  alerts_channel_id: 1542114553305899069         # audit-logs
  # Buyer agent now runs as its own process; disable in-process BuyerBot to
  # avoid a second Discord login on the shared bot_token (gelateria + chai).
  buyer_bot_enabled: false

webauthn:
  rp_id: "localhost"
  rp_name: "OpenStore Demo"
  origin: "http://localhost:8000"

database:
  url: "sqlite:///openstore.db"

llm:
  model: "gpt-4o-mini"
  temperature: 0.2

campaign:
  min_bps: 500
  max_bps: 3000
  max_active: 5
