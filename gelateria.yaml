# OpenStore configuration
# Fill in all values; unknown keys cause hard failure (R0.3)

merchant:
  name: "Gelateria Milano"
  currency: "INR"

razorpay:
  key_id: "${RAZORPAY_KEY_ID}"
  key_secret: "${RAZORPAY_KEY_SECRET}"
  webhook_secret: "${RAZORPAY_WEBHOOK_SECRET}"

discord:
  bot_token: "${DISCORD_BOT_TOKEN}"
  buyer_trace_channel_id: 123456789012345678
  merchant_trace_channel_id: 123456789012345679
  money_trace_channel_id: 123456789012345680
  alerts_channel_id: 123456789012345681

webauthn:
  rp_id: "localhost"
  rp_name: "OpenStore Demo"
  origin: "http://localhost:8000"

database:
  url: "sqlite:///openstore.db"

llm:
  model: "gpt-4o-mini"
  temperature: 0.2

campaign:
  min_bps: 500
  max_bps: 3000
  max_active: 5
