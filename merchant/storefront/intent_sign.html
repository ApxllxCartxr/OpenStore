<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign Intent Policy — OpenStore</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input, select { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 1.5rem; padding: 0.75rem 2rem; font-size: 1rem; cursor: pointer;
             background: #2563eb; color: white; border: none; border-radius: 6px; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 1rem; padding: 1rem; border-radius: 6px; display: none; }
    #status.ok { display: block; background: #dcfce7; color: #166534; }
    #status.err { display: block; background: #fee2e2; color: #991b1b; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <h1>Sign Your Intent Policy</h1>
  <p>Set the constraints your AI agent must follow. This policy is cryptographically
     bound to your passkey — once signed, the merchant server will enforce these limits
     mathematically on every checkout.</p>

  <form id="policyForm">
    <label for="max_spend">Maximum spend per checkout (₹)</label>
    <input type="number" id="max_spend" value="500" min="1" max="100000">

    <label for="allowed_tags">Allowed product tags (comma-separated)</label>
    <input type="text" id="allowed_tags" value="vegan, dairy-free, fruit"
           placeholder="e.g. vegan, dairy-free, gift">

    <label for="merchant_id">Merchant ID</label>
    <input type="text" id="merchant_id" value="gelateria-roma">

    <label for="expiry_hours">Policy expires after (hours)</label>
    <input type="number" id="expiry_hours" value="24" min="1" max="168">

    <button type="submit" id="signBtn">Sign with Passkey</button>
  </form>

  <div id="status"></div>

  <p style="margin-top: 2rem;"><a href="/intent/register">No passkey yet? Register first →</a></p>

  <script>
    const MERCHANT_URL = window.location.origin;

    async function getCredentialId() {
      const resp = await fetch(`${MERCHANT_URL}/internal/intent-status`);
      const data = await resp.json();
      if (!data.has_policy) return null;
      // Fetch the latest assertion to get the credential_id
      try {
        const assertResp = await fetch(`${MERCHANT_URL}/internal/webauthn/latest-assertion`);
        if (assertResp.ok) {
          const d = await assertResp.json();
          return d.policy_token?.rawId || d.policy_token?.id || null;
        }
      } catch {}
      return null;
    }

    document.getElementById("policyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("signBtn");
      const status = document.getElementById("status");
      btn.disabled = true;
      status.className = ""; status.style.display = "none";

      try {
        const credentialId = await getCredentialId();
        if (!credentialId) {
          window.location.href = "/intent/register";
          return;
        }

        const policy = {
          max_spend_minor: parseInt(document.getElementById("max_spend").value) * 100,
          allowed_tags: document.getElementById("allowed_tags").value
            .split(",").map(t => t.trim()).filter(Boolean),
          blocked_skus: [],
          merchant_id: document.getElementById("merchant_id").value,
          expires_at: Math.floor(Date.now()/1000)
            + parseInt(document.getElementById("expiry_hours").value) * 3600,
        };

        // Step 1: Begin authentication ceremony (get random nonce + browser options)
        const beginResp = await fetch(`${MERCHANT_URL}/internal/webauthn/begin-signing`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({credential_id: credentialId, policy: policy}),
        });
        if (!beginResp.ok) throw new Error("Failed to begin signing ceremony");
        const {nonce, options} = await beginResp.json();

        // Step 2: Browser signs the random nonce via passkey
        const challengeBytes = Uint8Array.from(atob(nonce), c => c.charCodeAt(0));
        // Decode WebAuthn options for navigator.credentials.get()
        const getOptions = options.public_key || options;
        if (getOptions.challenge) {
          getOptions.challenge = Uint8Array.from(atob(getOptions.challenge), c => c.charCodeAt(0));
        }
        if (getOptions.allow_credentials) {
          getOptions.allow_credentials = getOptions.allow_credentials.map(cred => ({
            ...cred,
            id: Uint8Array.from(atob(cred.id), c => c.charCodeAt(0)),
          }));
        }

        const assertion = await navigator.credentials.get({publicKey: getOptions});

        // Step 3: Complete ceremony — server verifies assertion + stores policy token
        const completeResp = await fetch(`${MERCHANT_URL}/internal/webauthn/complete-signing`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            credential_id: credentialId,
            assertion: {
              id: assertion.id,
              rawId: btoa(String.fromCharCode(...new Uint8Array(assertion.rawId))),
              type: assertion.type,
              response: {
                clientDataJSON: btoa(String.fromCharCode(
                  ...new Uint8Array(assertion.response.clientDataJSON))),
                authenticatorData: btoa(String.fromCharCode(
                  ...new Uint8Array(assertion.response.authenticatorData))),
                signature: btoa(String.fromCharCode(
                  ...new Uint8Array(assertion.response.signature))),
              },
            },
            policy_json: policy,
          }),
        });

        if (!completeResp.ok) {
          const err = await completeResp.json();
          throw new Error(err.detail || "Signing failed");
        }

        status.className = "ok";
        status.textContent = "Intent Policy signed and stored. Your agent may now shop.";
      } catch (err) {
        status.className = "err";
        status.textContent = `Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
