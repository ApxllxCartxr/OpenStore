name: CI

# Every push (§10 CI): firewall · Closed-Sets.md diff · money lint · time lint ·
# pytest. Any red is a stop.
#
# The vitest / svelte-check / golden-replay jobs land with the surfaces they
# test (B1, C1, A6). A job that passes because nothing exists to run is worse
# than no job — it reads green and means nothing.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1" # the lockfile is the pin; CI never re-resolves

jobs:
  guardrails:
    name: Guardrails (firewall, registry, money, time)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
          enable-cache: true

      - run: uv sync --frozen

      # The firewall runs first: a cross-root import makes every other result
      # meaningless, because the thing under test is no longer three surfaces.
      - name: Import firewall (all roots, both directions, design/ assets-only)
        run: uv run scripts/lint_firewall.py

      - name: docs/Closed-Sets.md matches the enums
        run: uv run scripts/registry_diff.py --check

      - name: No code in spec prose is missing from the registry
        run: uv run scripts/registry_diff.py --prose

      - name: Money lint (paise integers, no float in a money path)
        run: uv run scripts/lint_money.py

      - name: Time lint (UTC, no naive datetimes)
        run: uv run scripts/lint_time.py

  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"
          enable-cache: true

      - run: uv sync --frozen

      - name: ruff
        run: |
          uv run ruff check src scripts tests
          uv run ruff format --check src scripts tests

      - name: mypy --strict
        run: uv run mypy src scripts

      # Includes the planted-violation tests, which are the only proof the
      # guardrails above actually bite.
      - name: pytest
        run: uv run pytest -q

  surfaces:
    name: Merchant site and buyer chat
    runs-on: ubuntu-latest
    strategy:
      matrix:
        surface: [merchant-site, buyer-chat]
    defaults:
      run:
        working-directory: demo/${{ matrix.surface }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm install -g pnpm@11.26.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec svelte-kit sync
      - name: svelte-check
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json
      - name: vitest
        run: pnpm vitest run

  compose:
    name: Boots behind the proxy split
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start
        run: docker compose up -d --build sidecar caddy

      - name: The sidecar answers through Caddy on the Merchant domain
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -H 'Host: spoiledduckie.localhost' http://127.0.0.1/agentic/codes >/dev/null; then
              echo "up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS -H 'Host: spoiledduckie.localhost' http://127.0.0.1/agentic/codes | tee /dev/stderr | grep -q 'sold-out'

      - name: The store's routes are the store's, not the sidecar's
        run: |
          # `/` must NOT be answered by the sidecar. The store is not built yet,
          # so a 502 from Caddy is correct and a 200 would mean the split leaked.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: spoiledduckie.localhost' http://127.0.0.1/)
          test "$code" = "502" || { echo "expected 502 from an absent store, got $code"; exit 1; }

      - name: The whole stack, and the trait against the real store
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -fsS -H 'Host: spoiledduckie.localhost' http://127.0.0.1/ >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker compose exec -T store node --experimental-strip-types scripts/seed.ts

      - name: The edge serves only what is public
        run: |
          # The nine doors and the shop's admin are private-network only. A
          # proxy that forwards them is the kind of thing that gets configured
          # wrong once and then serves wrong forever, so it is asserted here.
          for path in /trait/catalog.read /admin /admin/orders; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: spoiledduckie.localhost' "http://127.0.0.1$path")
            test "$code" = "404" || { echo "$path is reachable from the edge ($code)"; exit 1; }
          done
          # And the three surfaces that ARE public all answer on one origin.
          curl -fsS -H 'Host: spoiledduckie.localhost' http://127.0.0.1/p/tote >/dev/null
          curl -fsS -H 'Host: spoiledduckie.localhost' http://127.0.0.1/agentic/health >/dev/null
          curl -fsS -H 'Host: chat.localhost' http://127.0.0.1/ >/dev/null

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.11"

      - name: The sidecar's conformance suite, against the real store
        run: uv sync --frozen && OPENSTORE_LIVE_TRAIT_URL=http://127.0.0.1:3000 uv run pytest tests/test_trait_live.py -q

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v
